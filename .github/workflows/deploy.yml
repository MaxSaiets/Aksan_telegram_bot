name: Deploy Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Deploy on server
        shell: powershell
        run: |
          $projectRoot = 'C:\bots\telegram_aksan_bot'

          if (-not (Test-Path $projectRoot)) {
            throw "Project root not found: $projectRoot"
          }

          Set-Location $projectRoot
          .\deploy.ps1
