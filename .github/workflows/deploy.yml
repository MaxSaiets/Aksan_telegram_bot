name: Deploy Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Bootstrap deploy script
        shell: powershell
        run: |
          $projectRoot = 'C:\bots\telegram_aksan_bot'

          if (-not (Test-Path $projectRoot)) {
            throw "Project root not found: $projectRoot"
          }

          Set-Location $projectRoot

          & git -c "safe.directory=$projectRoot" remote set-url origin https://github.com/MaxSaiets/Aksan_telegram_bot.git
          if ($LASTEXITCODE -ne 0) {
            throw 'git remote configuration failed'
          }

          & git -c "safe.directory=$projectRoot" fetch origin
          if ($LASTEXITCODE -ne 0) {
            throw 'git fetch failed'
          }

          & git -c "safe.directory=$projectRoot" reset --hard origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'git reset failed'
          }

      - name: Verify Python runtime
        shell: powershell
        run: |
          $pythonExe = 'C:\bots\telegram_aksan_bot\venv\Scripts\python.exe'
          if (-not (Test-Path $pythonExe)) {
            throw "Python venv executable not found: $pythonExe"
          }
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Python venv is not runnable'
          }

      - name: Deploy on server
        shell: powershell
        run: |
          $projectRoot = 'C:\bots\telegram_aksan_bot'
          Set-Location $projectRoot
          .\deploy.ps1
